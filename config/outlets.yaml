# Konfiguration der Nachrichtenagenturen/Outlets.
#
# feed_url: null solange kein Feed recherchiert wurde -> Outlet wird im Loop übersprungen.
# country/ausrichtung: jeweils als {de: ..., en: ...} hinterlegt, da die Discord-
#   Nachricht komplett in der Sprache des jeweiligen Artikels gepostet wird.
# ausrichtung: grobe redaktionelle Einordnung. Bei Nachrichtenagenturen i.d.R. "Wire
#   Service, sachlich/neutral" als Startwert - bei staatsnahen Agenturen ist das mit
#   Vorsicht zu lesen (z.B. Eigentümerstruktur), daher hier bewusst nicht weiter
#   politisch bewertet. Bitte bei Bedarf manuell anpassen/verfeinern.

outlets:
  # --- Tier 1: geopolitisch relevanteste Agenturen ---
  - name: Reuters
    tier: "Tier 1"
    flag: "🇬🇧"
    country:
      de: Vereinigtes Königreich
      en: United Kingdom
    ausrichtung:
      de: "Nachrichtenagentur, sachlich/neutral"
      en: "Wire service, factual/neutral"
    # Reuters hat keinen offiziellen RSS-Feed mehr (feeds.reuters.com ist tot) und
    # reuters.com ist per DataDome gegen Bots geschuetzt -> Workaround ueber
    # Google News RSS, gescoped auf site:reuters.com. Achtung: laut Google-ToS nur
    # fuer "personal, non-commercial use" vorgesehen; bewusst akzeptierter Kompromiss.
    # Liefert keinen echten Artikel-Body (nur Titel), siehe source_type-Handling.
    feed_url: "https://news.google.com/rss/search?q=site:reuters.com+when:1d&hl=en-US&gl=US&ceid=US:en"
    source_type: google_news
    feed_language: en
    active: true

  - name: Kyodo
    tier: "Tier 1"
    flag: "🇯🇵"
    country:
      de: Japan
      en: Japan
    ausrichtung:
      de: "Nachrichtenagentur, sachlich/neutral"
      en: "Wire service, factual/neutral"
    # echter offizieller Feed ("Japan Wire by Kyodo News", ihre englische
    # Wire-Marke) - nur auf der Homepage verlinkt, nicht dokumentiert.
    # Echte Summaries vorhanden -> Sprache wird ganz normal pro Artikel erkannt,
    # kein feed_language-Override wie bei Reuters noetig.
    feed_url: "https://english.kyodonews.net/list/feed/rss4kyodonews-fzone"
    active: true

  - name: dpa
    tier: "Tier 1"
    flag: "🇩🇪"
    country:
      de: Deutschland
      en: Germany
    ausrichtung:
      de: "Nachrichtenagentur, sachlich/neutral"
      en: "Wire service, factual/neutral"
    # Recherchiert, aber (noch) kein Feed: dpa ist reines B2B-Wire-Geschaeft ohne
    # eigene oeffentliche Newsseite. Google News fuer "dpa" liefert nur Treffer
    # bei Drittseiten (SZ.de, Lokalportale, ...), die dpa-Meldungen selbst
    # redigiert weiterverbreiten - kein sauberer "das ist wirklich dpa"-Filter
    # moeglich wie bei Reuters/AP/AFP ueber site:/<source>. Bleibt inaktiv.
    feed_url: null
    active: false

  - name: AFP
    tier: "Tier 1"
    flag: "🇫🇷"
    country:
      de: Frankreich
      en: France
    ausrichtung:
      de: "Nachrichtenagentur, sachlich/neutral"
      en: "Wire service, factual/neutral"
    # afp.com selbst ist eine SPA und die einzige oeffentliche RSS-Route dort
    # (/en/actus/.../feed) liefert nur "Inside AFP"-PR, keine echten Artikel.
    # Google News fuer "AFP" (ohne site:-Scope, sonst mischt afp.com auch sein
    # eigenes bezahltes Presseportal unter) trifft echte AFP-Artikel mit
    # Quelle "afp.com" - Fehltreffer wie "Americans for Prosperity" werden
    # über google_news_source rausgefiltert.
    feed_url: "https://news.google.com/rss/search?q=%22AFP%22+when:1d&hl=en-US&gl=US&ceid=US:en"
    source_type: google_news
    feed_language: en
    google_news_source: "afp.com"
    active: true

  # --- Tier 2 ---
  - name: Jiji
    tier: "Tier 2"
    flag: "🇯🇵"
    country:
      de: Japan
      en: Japan
    ausrichtung:
      de: "Nachrichtenagentur, sachlich/neutral"
      en: "Wire service, factual/neutral"
    # Echte englische Wire ("JIJI MAIN NEWS") ist nur als bezahltes Produkt ueber
    # ein JPX-Kundenportal erhaeltlich. Die oeffentliche Seite eng.jiji.com
    # verlangt Login; jen.jiji.com ist zwar frei erreichbar, hat aber keine
    # RSS-Route (/rss/ liefert 403) und reicht im "eng_afp"-Bereich nur
    # weitergereichte AFP-Meldungen durch statt eigenem Content. Google News
    # (site:jiji.com) findet quasi nichts (1 Treffer/2 Tage, leerer Titel).
    # Bleibt inaktiv.
    feed_url: null
    active: false

  - name: Antara
    tier: "Tier 2"
    flag: "🇮🇩"
    country:
      de: Indonesien
      en: Indonesia
    ausrichtung:
      de: "Nachrichtenagentur, staatlich (Indonesien), sachlich/neutral"
      en: "Wire service, state-owned (Indonesia), factual/neutral"
    # Echter offizieller Feed der englischen Nachrichtenseite. Echte Summaries
    # vorhanden, kein feed_language-Override noetig (analog Kyodo).
    feed_url: "https://en.antaranews.com/rss/news.xml"
    active: true

  - name: PA Media
    tier: "Tier 2"
    flag: "🇬🇧"
    country:
      de: Vereinigtes Königreich
      en: United Kingdom
    ausrichtung:
      de: "Nachrichtenagentur, sachlich/neutral"
      en: "Wire service, factual/neutral"
    # Echter offizieller Feed (WordPress-Blog "PA Editor's Picks" auf pa.media) -
    # keine vollstaendige Rohwire (die ist ein bezahltes B2B-Produkt), aber
    # echte, namentlich zurechenbare PA-Media-Artikel. Kein feed_language-
    # Override noetig.
    feed_url: "https://pa.media/feed/"
    active: true

  - name: EFE
    tier: "Tier 2"
    flag: "🇪🇸"
    country:
      de: Spanien
      en: Spain
    ausrichtung:
      de: "Nachrichtenagentur, mehrheitlich staatlich (Spanien), sachlich/neutral"
      en: "Wire service, majority state-owned (Spain), factual/neutral"
    # efe.com selbst ist per Bot-Schutz (JS-Challenge) dicht -> wie bei Reuters/AP
    # ueber Google News RSS gescoped auf site:efe.com. Echte EFE-Artikel laufen
    # unter Quelle "EFE - Agencia de noticias"; ueber google_news_source werden
    # Fehltreffer von "EFE Comunica" (separater PR-Presseverteiler, keine
    # redaktionellen Inhalte) rausgefiltert.
    feed_url: "https://news.google.com/rss/search?q=site:efe.com+when:1d&hl=en-US&gl=US&ceid=US:en"
    source_type: google_news
    feed_language: en
    google_news_source: "EFE - Agencia de noticias"
    active: true

  - name: SDA
    tier: "Tier 2"
    flag: "🇨🇭"
    country:
      de: Schweiz
      en: Switzerland
    ausrichtung:
      de: "Nachrichtenagentur, Genossenschaft, sachlich/neutral"
      en: "Wire service, cooperative, factual/neutral"
    # Wie dpa: reines B2B-Wire-Geschaeft ohne oeffentliche Newsseite mit
    # Endkunden-Artikeln. Google News fuer site:keystone-sda.ch liefert 0
    # Treffer, keine RSS-Route auf keystone-sda.ch auffindbar. Bleibt inaktiv.
    feed_url: null
    active: false

  # --- Tier 3 ---
  - name: AP
    tier: "Tier 3"
    flag: "🇺🇸"
    country:
      de: USA
      en: USA
    ausrichtung:
      de: "Nachrichtenagentur, sachlich/neutral"
      en: "Wire service, factual/neutral"
    # Wie Reuters: kein offizieller RSS-Feed mehr, apnews.com selbst laesst sich
    # nicht sauber scrapen -> Google News RSS gescoped auf site:apnews.com.
    # Liefert echte AP-Artikel (Quelle "AP News"), aber keinen echten Body.
    feed_url: "https://news.google.com/rss/search?q=site:apnews.com+when:1d&hl=en-US&gl=US&ceid=US:en"
    source_type: google_news
    feed_language: en
    google_news_source: "AP News"
    active: true
